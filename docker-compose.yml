services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app   # live reload in dev — remove in prod
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./frontend
      args:
        # Baked into the JS bundle at build time — the browser calls this
        # directly, so it must be reachable from the host, not the Docker
        # network (http://api:8000 would only resolve inside the network).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "4173:4173"
    environment:
      - PORT=4173
    depends_on:
      - api
